<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SGSS · Inicio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-black: #0a0f0c;
    --bg-panel: #0f1712;
    --green-mid: #1c5c3a;
    --green-bright: #3ddc84;
    --green-line: #234531;
    --text-main: #eef3ef;
    --text-muted: #8fa397;
    --text-faint: #5c7267;
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
  }

  *{ box-sizing: border-box; }
  html, body{ margin:0; padding:0; }
  body{
    background: var(--bg-black);
    color: var(--text-main);
    font-family: var(--font-body);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  a{ color: inherit; text-decoration: none; }

  /* ---------- Nav ---------- */
  header{
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 32px;
    background: rgba(10,15,12,0.85);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--green-line);
  }

  .logo-group{
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .logo-mark{
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 5px;
    flex-shrink: 0;
    box-shadow: 0 6px 18px rgba(61,220,132,0.2);
  }
  .logo-mark img{ width: 100%; height: 100%; object-fit: contain; }

  .brand-name{
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 14px;
    line-height: 1.3;
  }
  .brand-name span{
    display: block;
    font-family: var(--font-body);
    font-weight: 400;
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 1px;
  }

  nav{
    display: flex;
    align-items: center;
    gap: 8px;
  }
  nav a{
    font-size: 14px;
    font-weight: 600;
    color: var(--text-muted);
    padding: 9px 16px;
    border-radius: 8px;
    transition: color .15s ease, background .15s ease;
  }
  nav a:hover{
    color: var(--text-main);
    background: var(--bg-panel);
  }
  nav a.cta{
    color: #06170e;
    background: linear-gradient(135deg, var(--green-mid), var(--green-bright));
  }
  nav a.cta:hover{
    filter: brightness(1.08);
  }

  /* menu móvil */
  .menu-btn{
    display: none;
    background: none;
    border: 1px solid var(--green-line);
    border-radius: 8px;
    padding: 8px;
    cursor: pointer;
    color: var(--text-main);
  }

  /* ---------- Hero ---------- */
  main{
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: calc(100vh - 73px);
    padding: 40px 24px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  main::before{
    content:"";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 25% 30%, rgba(61,220,132,0.12), transparent 45%),
      radial-gradient(circle at 80% 75%, rgba(28,92,58,0.3), transparent 50%);
    pointer-events: none;
  }

  .hero{
    position: relative;
    z-index: 2;
    max-width: 560px;
  }
  .eyebrow{
    font-size: 13px;
    color: var(--green-bright);
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 18px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .eyebrow::before{
    content:"";
    width: 22px;
    height: 1px;
    background: var(--green-bright);
  }
  h1{
    font-family: var(--font-display);
    font-size: clamp(32px, 5vw, 46px);
    font-weight: 600;
    line-height: 1.15;
    margin: 0 0 16px;
  }
  h1 em{
    font-style: normal;
    color: var(--green-bright);
  }
  .hero p{
    color: var(--text-muted);
    font-size: 16px;
    line-height: 1.6;
    margin: 0 0 32px;
  }
  .hero-actions{
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .btn{
    padding: 13px 26px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 15px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .btn-primary{
    color: #06170e;
    background: linear-gradient(135deg, var(--green-mid), var(--green-bright));
    box-shadow: 0 10px 28px rgba(61,220,132,0.18);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .btn-primary:hover{ transform: translateY(-1px); box-shadow: 0 14px 32px rgba(61,220,132,0.26); }
  .btn-secondary{
    color: var(--text-main);
    border: 1.5px solid var(--green-line);
    transition: border-color .15s ease, background .15s ease;
  }
  .btn-secondary:hover{
    border-color: var(--green-bright);
    background: var(--bg-panel);
  }

  @media (max-width: 720px){
    header{ padding: 14px 18px; }
    .brand-name{ display: none; }
    nav{
      position: absolute;
      top: 100%;
      right: 18px;
      left: 18px;
      flex-direction: column;
      align-items: stretch;
      background: var(--bg-panel);
      border: 1px solid var(--green-line);
      border-radius: 12px;
      padding: 8px;
      display: none;
      gap: 4px;
    }
    nav.open{ display: flex; }
    nav a{ text-align: center; }
    .menu-btn{ display: flex; }
  }
</style>
</head>
